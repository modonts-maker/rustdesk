name: Build Windows x64 Client

on:
  workflow_dispatch:

env:
  RENDEZVOUS_SERVER: "${{ secrets.RENDEZVOUS_SERVER }}"
  RS_PUB_KEY: "${{ secrets.RS_PUB_KEY }}"
  API_SERVER: "${{ secrets.API_SERVER }}"
  RELAY_SERVER: "${{ secrets.RELAY_SERVER }}"
  SCITER_RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VERSION: "1.4.9"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-windows:
    name: Build Windows x64
    needs: [generate-bridge]
    runs-on: windows-2022
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Hardcode Custom Server into Source Code
        shell: pwsh
        run: |
          $server = "${{ secrets.RENDEZVOUS_SERVER }}"
          $key = "${{ secrets.RS_PUB_KEY }}"
          $api = "${{ secrets.API_SERVER }}"
          
          # 替换 hbb_common 中的默认服务器常量
          Get-ChildItem -Path ./libs/hbb_common/src -Filter "*.rs" -Recurse | ForEach-Object {
            (Get-Content $_.FullName) `
              -replace 'rs-sg\.rustdesk\.com', $server `
              -replace 'rs-cn\.rustdesk\.com', $server `
              -replace 'rs-ny\.rustdesk\.com', $server `
              -replace 'api\.rustdesk\.com', $api `
              | Set-Content $_.FullName
          }
          
          # 在 config.rs 中强制替换 RS_PUB_KEY
          $configPath = "./libs/hbb_common/src/config.rs"
          if (Test-Path $configPath) {
            $content = Get-Content $configPath -Raw
            $content = $content -replace 'pub const RS_PUB_KEY:.*?;', "pub const RS_PUB_KEY: &str = `"$key`";"
            Set-Content -Path $configPath -Value $content
          }

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release -Force
          $flutterBin = Split-Path (Get-Command flutter.bat).Source
          $engineDir = Join-Path (Split-Path $flutterBin) "bin\cache\artifacts\engine\windows-x64-release"
          if (-not (Test-Path $engineDir)) {
            New-Item -ItemType Directory -Force -Path $engineDir
          }
          Copy-Item -Path windows-x64-release\* -Destination $engineDir -Force -Recurse

      - name: Patch flutter
        continue-on-error: true
        shell: bash
        run: |
          flutter_root=$(dirname $(dirname $(which flutter)))
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$flutter_root" || true
          cd "$flutter_root"
          git apply --ignore-space-change --ignore-whitespace flutter_3.24.4_dropdown_menu_enableFilter.diff || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"
        shell: bash

      - name: Build rustdesk
        shell: pwsh
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          Move-Item -Path ./flutter/build/windows/x64/runner/Release -Destination ./rustdesk -Force

          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
            Expand-Archive usbmmidd_v2.zip -DestinationPath . -Force
            Remove-Item -Path usbmmidd_v2\Win32 -Recurse -ErrorAction SilentlyContinue
            Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat" -ErrorAction SilentlyContinue
            Move-Item -Force .\usbmmidd_v2 ./rustdesk
          } catch {
            Write-Host "usbmmidd skipped"
          }

      - name: Copy icon and resource
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res" | head -n 1)
          if [ -n "$runner_res" ]; then
            cp "$runner_res" ./libs/portable/Runner.res
          fi

      - name: Build self-extracted single exe
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml || true
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/RustDesk-Custom-Setup.exe

      - name: Upload Single File EXE
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Custom-Setup-EXE
          path: ./SignOutput/RustDesk-Custom-Setup.exe
